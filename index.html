<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhykLove — знакомства</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Приветствие / Регистрация / Вход -->
  <div id="reg-screen">
    <div class="logo">zhykLove</div>
    <p class="reg-sub">Знакомься рядом — просто и бесплатно</p>

    <!-- Приветствие -->
    <div id="welcome-fields">
      <button class="btn-main" onclick="enterAsGuest()">Смотреть анкеты</button>
      <button class="btn-ghost" onclick="showAuthForm('reg')">Создать аккаунт</button>
      <button class="btn-ghost" onclick="showAuthForm('login')">Войти</button>
    </div>

    <!-- Форма регистрации: только почта и пароль -->
    <div id="reg-fields" class="hidden">
      <div class="auth-note" id="reg-note-top"></div>
      <input id="reg-email" type="email" placeholder="Email">
      <input id="reg-pass" type="password" placeholder="Придумайте пароль (мин. 6 символов)">
      <input id="reg-pass2" type="password" placeholder="Повторите пароль">
      <button class="btn-main" onclick="register()">Создать аккаунт</button>
      <button class="btn-ghost" onclick="showAuthForm('welcome')">Назад</button>
    </div>

    <!-- Форма входа: только почта и пароль -->
    <div id="login-fields" class="hidden">
      <div class="auth-note" id="login-note-top"></div>
      <input id="login-email" type="email" placeholder="Email">
      <input id="login-pass" type="password" placeholder="Пароль">
      <button class="btn-main" onclick="login()">Войти</button>
      <button class="btn-ghost" onclick="showAuthForm('welcome')">Назад</button>
    </div>
  </div>

  <!-- Шапка -->
  <header id="header" class="hidden">
    <div class="logo logo-sm">zhykLove</div>
    <div class="header-right">
      <div class="header-ava" id="header-ava" onclick="showScreen('profile')">?</div>
    </div>
  </header>

  <!-- Главная: лента анкет -->
  <div id="screen-home" class="screen hidden"></div>

  <!-- Лайкнутые -->
  <div id="screen-likes" class="screen hidden">
    <h3 class="section">Твои лайки</h3>
    <div id="likes-list"></div>
  </div>

  <!-- Чаты: список -->
  <div id="screen-chats" class="screen hidden">
    <h3 class="section">Чаты</h3>
    <div id="chats-list"></div>
  </div>

  <!-- Чат: переписка -->
  <div id="screen-chat" class="screen hidden">
    <div id="chat-header">
      <button id="back-btn" onclick="showScreen('chats')">←</button>
      <div class="ava" id="chat-ava">?</div>
      <div>
        <div style="font-weight:600" id="chat-name"></div>
        <div style="font-size:12px;color:#999" id="chat-age"></div>
      </div>
    </div>

    <div id="chat-box"></div>

    <div id="chat-input-row">
      <input id="chat-input" placeholder="Сообщение..." maxlength="2000">
      <button id="chat-send" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- Прямой эфир -->
  <div id="screen-live" class="screen hidden">
    <h3 class="section">Прямой эфир</h3>

    <!-- Список эфиров -->
    <div id="live-list"></div>

    <button class="btn-main" id="btn-start-live" onclick="startLive()">🔴 Начать эфир</button>

    <!-- Видео и чат эфира -->
    <div id="live-video-wrap" class="hidden">
      <div class="live-video-frame">
        <video id="live-video" autoplay playsinline></video>
        <div id="live-status"></div>
      </div>

      <div id="live-chat-box"></div>

      <div id="live-chat-row">
        <input id="live-chat-input" placeholder="Сообщение..." maxlength="200">
        <button id="live-chat-send" onclick="sendLiveChat()">➤</button>
      </div>

      <button class="btn-logout" id="btn-leave-live" onclick="leaveLive()">Выйти из эфира</button>
    </div>
  </div>

  <!-- Профиль -->
  <div id="screen-profile" class="screen hidden">
    <h3 class="section">Мой профиль</h3>

    <!-- Аватар и фото -->
    <div class="profile-hero">
      <div class="profile-ava-ring">
        <div class="profile-ava" id="profile-ava">?</div>
      </div>
      <label class="photo-upload" for="photo-input">📷 Загрузить своё фото</label>
      <input id="photo-input" type="file" accept="image/*" class="hidden">
      <button class="btn-ghost photo-remove hidden" id="photo-remove" onclick="removePhoto()">Удалить фото</button>
    </div>

    <!-- Статистика -->
    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="stat-likes">0</div>
        <div class="stat-cap">лайков</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-matches">0</div>
        <div class="stat-cap">мэтчей</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-chats">0</div>
        <div class="stat-cap">чатов</div>
      </div>
    </div>

    <!-- Данные анкеты -->
    <div class="profile-card">
      <div class="form-grid">
        <div class="form-field">
          <label class="p-label">Имя</label>
          <input id="prof-name" maxlength="30" placeholder="Как тебя зовут?">
        </div>
        <div class="form-field">
          <label class="p-label">Возраст</label>
          <input id="prof-age" type="number" min="18" max="99">
        </div>
        <div class="form-field">
          <label class="p-label">Страна</label>
          <select id="prof-country">
            <option value="Россия">Россия</option>
            <option value="Казахстан">Казахстан</option>
            <option value="Беларусь">Беларусь</option>
            <option value="Другая">Другая</option>
          </select>
        </div>
        <div class="form-field">
          <label class="p-label">Регион</label>
          <input id="prof-region" maxlength="50" placeholder="Например, Татарстан">
        </div>
        <div class="form-field">
          <label class="p-label">Город</label>
          <input id="prof-city" maxlength="30" placeholder="Например, Казань">
        </div>
        <div class="form-field">
          <label class="p-label">Мой пол</label>
          <select id="prof-gender">
            <option value="f">Девушка</option>
            <option value="m">Парень</option>
          </select>
        </div>
        <div class="form-field">
          <label class="p-label">Кого ищу</label>
          <select id="prof-seeking">
            <option value="f">Девушек</option>
            <option value="m">Парней</option>
          </select>
        </div>
        <div class="form-field">
          <label class="p-label">Знакомлюсь для</label>
          <select id="prof-goal">
            <option value="flirt">Флирт</option>
            <option value="romance">Романтика</option>
            <option value="serious">Серьёзные отношения</option>
          </select>
        </div>
        <div class="form-field">
          <label class="p-label">Семейное положение</label>
          <select id="prof-marital">
            <option value="single">Не в отношениях</option>
            <option value="dating">Встречаюсь</option>
            <option value="married">Женат / замужем</option>
            <option value="complicated">Всё сложно</option>
          </select>
        </div>
        <div class="form-field">
          <label class="p-label">Курение</label>
          <select id="prof-smoke">
            <option value="no">Не курю</option>
            <option value="rare">Курю редко</option>
            <option value="yes">Курю</option>
          </select>
        </div>
        <div class="form-field">
          <label class="p-label">Алкоголь</label>
          <select id="prof-drink">
            <option value="no">Не пью</option>
            <option value="rare">Пью редко</option>
            <option value="yes">Пью</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label class="p-label">О себе</label>
        <textarea id="prof-bio" maxlength="120" placeholder="Пара слов о себе..."></textarea>
        <div class="bio-note" id="bio-count">0 / 120</div>
      </div>

      <button class="btn-main" onclick="saveProfile()">Сохранить профиль</button>
      <div class="profile-note" id="prof-note"></div>
    </div>

    <button class="btn-logout" onclick="logout()">Выйти из аккаунта</button>
  </div>

  <!-- Попап совпадения -->
  <div id="match-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-hearts">💜</div>
      <h2>Это взаимно!</h2>
      <p id="match-text"></p>
      <button class="btn-main" onclick="closeMatch()">Написать сообщение</button>
      <button class="btn-ghost" onclick="closeMatch(true)">Позже</button>
    </div>
  </div>

  <nav class="hidden" id="nav">
    <button id="nav-home" class="nav-button active" onclick="showScreen('home')">🔥</button>
    <button id="nav-likes" class="nav-button" onclick="showScreen('likes')">❤️<span class="badge hidden" id="likes-badge"></span></button>
    <button id="nav-chats" class="nav-button" onclick="showScreen('chats')">💬<span class="badge hidden" id="chats-badge"></span></button>
    <button id="nav-live" class="nav-button" onclick="showScreen('live')">📺</button>
    <button id="nav-profile" class="nav-button" onclick="showScreen('profile')">👤</button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
